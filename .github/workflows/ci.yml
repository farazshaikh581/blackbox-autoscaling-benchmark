name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q
      - name: Smoke-run both algorithms
        run: |
          python -m experiments.run_nsga2 --pop 8 --evals 40 --seed 1 --tiers 2 --k 2
          python -m experiments.run_moead --partitions 4 --evals 40 --seed 1 --tiers 2 --k 2
